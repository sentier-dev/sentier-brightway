<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAFU-2026 · sentier-brightway vs openLCA (EF 3.1)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F0EEE1;
      --surf: #FFFFFF;
      --surf2: #e8e6d9;
      --bord: #d4d2c5;
      --txt: #2B2B2B;
      --dim: #555555;
      --accent: #3C5343;
      --blue: #84AE99;
      --orange: #C1623F;
      --cell-text: rgba(43, 43, 43, 0.82);
      --grid: rgba(43, 43, 43, 0.05);
      --row-sep: rgba(43, 43, 43, 0.04);
      --sel-bg: rgba(60, 83, 67, 0.10);
    }
    html, body { height: 100%; background: var(--bg); color: var(--txt); font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; }
    #root { height: 100%; display: flex; flex-direction: column; }

    .header {
      /* Fixed height so the banner never resizes when the per-view
         title/subtitle/legend content changes (logo 104px + 14/12 padding). */
      height: 130px;
      padding: 14px 22px 12px;
      background: var(--surf);
      border-bottom: 1px solid var(--bord);
      display: flex;
      align-items: center;
      gap: 28px;
      flex-shrink: 0;
    }
    .header-text { flex: 1 1 auto; min-width: 0; max-height: 104px; overflow: hidden; }
    .header h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
    .header-sub { font-size: 10px; color: var(--dim); font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
    .legend { display: flex; gap: 14px; row-gap: 3px; align-items: center; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 9.5px; color: var(--dim); font-family: 'JetBrains Mono', monospace; }
    .swatch { width: 28px; height: 9px; border-radius: 2px; }
    .legend-info { display: inline-flex; align-items: center; justify-content: center; width: 13px; height: 13px; border-radius: 50%; border: 1px solid var(--dim); color: var(--dim); font-size: 9px; font-family: 'JetBrains Mono', monospace; font-weight: 500; line-height: 1; }
    .legend-cellinfo { display: inline-flex; align-items: center; justify-content: center; width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(20,24,40,0.45); color: rgba(20,24,40,0.7); font-size: 7px; font-family: 'JetBrains Mono', monospace; font-weight: 500; line-height: 1; }
    .swatch-blue { background: linear-gradient(to right, rgba(132,174,153,0.15), rgba(132,174,153,0.85)); }
    .swatch-orange { background: linear-gradient(to right, rgba(193,98,63,0.15), rgba(193,98,63,0.85)); }
    .header-stats { margin-left: auto; display: flex; gap: 22px; flex-shrink: 0; }
    .stat-item { text-align: right; }
    .stat-n { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 500; line-height: 1; color: var(--txt); }
    .stat-lbl { font-size: 8.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

    .tabs { display: flex; gap: 4px; margin-left: 24px; flex-shrink: 0; }
    .tab {
      background: transparent; border: 1px solid var(--bord);
      color: var(--dim); cursor: pointer;
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      padding: 5px 12px; border-radius: 3px;
      letter-spacing: 0.04em; text-transform: uppercase;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .tab:hover { color: var(--txt); border-color: var(--dim); }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #ffffff; }


    .main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .table-wrap { flex: 1; overflow: auto; }

    table { border-collapse: separate; border-spacing: 0; width: 100%; }

    thead th {
      position: sticky; top: 0; z-index: 10;
      background: var(--surf);
      border-bottom: 2px solid var(--bord);
      font-size: 9.5px; font-weight: 500; color: var(--dim);
      font-family: 'JetBrains Mono', monospace;
      text-align: center; vertical-align: bottom;
      padding: 0 2px 6px;
      cursor: pointer; user-select: none;
      transition: color 0.15s;
    }
    thead th:hover { color: var(--accent); }
    thead th.sorted { color: var(--accent); }

    .th-wrap { height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; }
    .th-info-slot { height: 14px; display: flex; align-items: center; justify-content: center; }
    .th-text { writing-mode: vertical-lr; transform: rotate(180deg); font-size: 10px; white-space: nowrap; letter-spacing: 0.01em; color: var(--txt); }
    .th-mean { font-size: 8.5px; color: var(--dim); }

    th.name-col, td.name-col {
      position: sticky; left: 0; z-index: 5;
      background: var(--surf);
      border-right: 1px solid var(--bord);
      min-width: 208px; max-width: 208px;
      padding: 0 10px 0 14px;
    }
    thead th.name-col { z-index: 20; text-align: left; font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; vertical-align: bottom; padding-bottom: 6px; }
    td.name-col { cursor: pointer; }
    .pcode { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--dim); display: block; margin-bottom: 1px; }
    .pname { font-size: 11px; color: var(--txt); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 186px; }

    tbody tr { border-bottom: 1px solid var(--row-sep); cursor: pointer; }
    tbody tr:hover td, tbody tr:hover th { background: var(--surf2) !important; }
    tbody tr.sel td, tbody tr.sel th { background: var(--sel-bg) !important; }
    tbody tr.sel td.name-col { border-right-color: var(--accent); }

    td.data-cell {
      min-width: 52px; height: 34px;
      text-align: center; vertical-align: middle;
      position: relative;
      border-right: 1px solid var(--grid);
      transition: filter 0.1s;
      font-family: 'JetBrains Mono', monospace;
      font-size: 8px;
      color: var(--cell-text);

    }
    td.data-cell:hover { filter: saturate(1.25) contrast(1.05); }
    .xdot { position: absolute; top: 2px; right: 2px; width: 3px; height: 3px; border-radius: 50%; background: rgba(20,24,40,0.6); }

    .tooltip {
      position: fixed; pointer-events: none; z-index: 1000;
      background: #ffffff; border: 1px solid var(--bord);

    }
    .tt-cat { font-size: 10px; color: var(--dim); margin-bottom: 2px; }
    .tt-val { font-size: 15px; font-weight: 600; }
    .tt-prod { font-size: 10px; color: var(--txt); margin-top: 5px; border-top: 1px solid var(--bord); padding-top: 5px; }
    .tt-vers { margin-top: 5px; border-top: 1px solid var(--bord); padding-top: 5px; display: flex; flex-direction: column; gap: 3px; }
    .tt-ver { font-size: 9px; color: var(--dim); line-height: 1.35; font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .ver-tag { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--accent); border: 1px solid var(--accent); border-radius: 2px; padding: 0 3px; margin-right: 5px; vertical-align: 1px; }
    .tt-reason { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--bord); }

    .info-icon {

      color: rgba(20,24,40,0.7);
      font-family: 'JetBrains Mono', monospace; font-weight: 500;

    .method-popover {

    .mp-long { font-size: 11.5px; color: var(--txt); line-height: 1.55; }
    .mp-badge { display: inline-block; margin-top: 8px; font-size: 9px; color: #3C5343; border: 1px solid rgba(60,83,67,0.4); background: rgba(60,83,67,0.06); border-radius: 2px; padding: 2px 6px; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.03em; }

    .detail-code { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--accent); margin-right: 6px; }
    .detail-name { font-size: 12px; font-weight: 600; color: var(--txt); }

    .detail-close {

    /* Box-plot main view (inline SVG, fixed viewBox scaled to the panel width). */
    .scroll { flex: 1; overflow: auto; }
    .box-panel { background: var(--surf); border-bottom: 1px solid var(--bord); padding: 8px 18px 2px; }

    .box-bar label { text-transform: uppercase; letter-spacing: 0.06em; font-size: 8.5px; }
    .box-bar select { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; padding: 3px 6px; border: 1px solid var(--bord); border-radius: 3px; background: var(--surf); color: var(--txt); max-width: 320px; }
    .box-svg { width: 100%; max-height: 52vh; display: block; }
    .box-svg .axis { fill: var(--dim); font-family: 'JetBrains Mono', monospace; font-size: 9.5px; }
    .box-svg .axis-zero { fill: var(--txt); }
    .box-svg .cat-label { fill: var(--txt); font-family: 'JetBrains Mono', monospace; font-size: 10px; cursor: pointer; }
    .box-svg .cat-label:hover, .box-svg .cat-label.picked { fill: var(--accent); font-weight: 600; }
    .box-svg .cat-n { fill: var(--dim); font-family: 'JetBrains Mono', monospace; font-size: 8px; }
    .box-svg .hit { fill: transparent; cursor: pointer; }
    .box-svg .hit:hover, .box-svg .hit.picked { fill: rgba(60, 83, 67, 0.07); }
    .box-svg .info-icon circle { fill: var(--surf); stroke: var(--dim); stroke-width: 1; }
    .box-svg .info-icon text { fill: var(--dim); font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 500; }
    .box-svg .info-icon:hover circle, .box-svg .info-icon.active circle { stroke: var(--accent); fill: rgba(60, 83, 67, 0.12); }
    .box-svg .info-icon:hover text, .box-svg .info-icon.active text { fill: var(--accent); }
    .tt-stats { font-size: 10px; color: var(--txt); margin-top: 5px; border-top: 1px solid var(--bord); padding-top: 5px; display: grid; grid-template-columns: auto auto; column-gap: 12px; row-gap: 1px; }
    .tt-stats span:nth-child(odd) { color: var(--dim); }
    .header-dl { font-size: 9.5px; color: var(--dim); font-family: 'JetBrains Mono', monospace; margin-top: 5px; }
    .header-dl a { color: var(--accent); text-decoration: none; }
    .header-dl a:hover { text-decoration: underline; }
    .stat-n.stat-txt { font-size: 13px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-top: 5px; }

    /* Worst-200 drill-down table. */
    .worst { background: var(--surf); border-top: 2px solid var(--accent); }
    .worst-hdr { display: flex; align-items: baseline; gap: 14px; padding: 10px 18px 6px; flex-wrap: wrap; }
    .worst-title { font-size: 12px; font-weight: 600; color: var(--txt); }
    .worst-stats { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: var(--dim); display: flex; gap: 12px; flex-wrap: wrap; }
    .worst-note { font-size: 9.5px; color: var(--orange); font-style: italic; }
    .worst-filter { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 3px 8px; border: 1px solid var(--bord); border-radius: 3px; background: var(--surf); color: var(--txt); width: 230px; }
    .worst-msg { padding: 8px 18px 12px; font-size: 11px; color: var(--dim); font-style: italic; }
    .worst thead th { text-align: left; padding: 4px 8px 6px; white-space: nowrap; }
    .worst thead th.num { text-align: right; }
    .worst td { font-size: 10.5px; padding: 4px 8px; border-bottom: 1px solid var(--row-sep); white-space: nowrap; color: var(--txt); }
    .worst td.rank { color: var(--dim); font-family: 'JetBrains Mono', monospace; font-size: 9px; }
    .worst td.pname-cell { max-width: 460px; overflow: hidden; text-overflow: ellipsis; }

    .worst td.pct .cell-info { top: 3px; left: 3px; }

<div id="root"></div>
<script src="react.min.js"></script>
<script src="react-dom.min.js"></script>
<script src="babel.min.js"></script>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

// Data files written by `sentier-brightway backtest --out DIR`.
//   boxes.json   box-plot statistics per sector x category; the page's main view
//   worst/       <short>.json: the 200 rows with the largest |Δ| per category
//   vs_bafu.csv  Δ% of our bw2calc score vs BAFU's openLCA score per process;
//                fetched lazily (first row click) for the per-process detail panel
const BOXES_URL = 'boxes.json';
const WORST_DIR = 'worst';
const VS_BAFU_URL = 'vs_bafu.csv';
const VS_BAFU_SIZE = '4.7 MB';
const REASONS_URL = 'outlier_reasons.json';
// Per-product × outlier-impact notes (authored by dds-build-product-reasons).
// Keyed code → impact short-id → text. Shown above the impact-level note.
const PRODUCT_REASONS_URL = 'product_reasons.json';
// Outlier threshold (percent): a product × impact cell at or above this |%diff|
// surfaces its impact's plain-English explanation (cell ⓘ marker + tooltip reason).
const OUTLIER_PCT = 30;
const BASE_TAG = 'openLCA';

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return { headers: [], rows: [] };
  const split = (line) => {
    // Minimal CSV split supporting quoted fields with commas.
    const out = []; let cur = ''; let q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { if (q && line[i+1] === '"') { cur += '"'; i++; } else { q = !q; } }
      else if (ch === ',' && !q) { out.push(cur); cur = ''; }
      else { cur += ch; }
    }
    out.push(cur);
    return out;
  };
  const headers = split(lines[0]);
  const rows = lines.slice(1).map(line => {
    const cells = split(line);
    const obj = {};
    headers.forEach((h, i) => obj[h] = cells[i] ?? '');
    return obj;
  });
  return { headers, rows };
}

// CATS-BEGIN
const CATS = [
  ['climate',      'Climate Change'],
  ['cc_bio',       'CC: Biogenic'],
  ['cc_fos',       'CC: Fossil'],
  ['cc_luc',       'CC: LULUC'],
  ['ozone',        'Ozone Depletion'],
  ['radiation',    'Ionising Radiation'],
  ['photo_ox',     'Photochem. Oxidant'],
  ['pm',           'Particulate Matter'],
  ['ht_nc',        'HT: Non-Carcinog.'],
  ['ht_nc_inorg',  'HT: NC Inorg.'],
  ['ht_nc_org',    'HT: NC Org.'],
  ['ht_c',         'HT: Carcinog.'],
  ['ht_c_inorg',   'HT: C Inorg.'],
  ['ht_c_org',     'HT: C Org.'],
  ['acid',         'Acidification'],
  ['e_fw',         'Eutro. Freshwater'],
  ['e_m',          'Eutro. Marine'],
  ['e_t',          'Eutro. Terrestrial'],
  ['ecotox',       'Ecotox. Freshwater'],
  ['ecotox_inorg', 'Ecotox. Inorg.'],
  ['ecotox_org',   'Ecotox. Org.'],
  ['land',         'Land Use'],
  ['water',        'Water Use'],
  ['energy',       'Energy (non-ren.)'],
  ['mater',        'Materials'],
];
// CATS-END

// SAT_PCT: |%diff| at which the Δ cell background hits max intensity. Larger =
// outliers more visible (typical 10-50% diffs stay faint; 200-500% saturate).
const SAT_PCT = 500;
function cellBg(v, sat = SAT_PCT) {
  if (!Number.isFinite(v)) return 'rgba(43,43,43,0.025)';
  const abs = Math.abs(v);
  const norm = Math.min(1, Math.sqrt(abs / sat));
  const alpha = 0.10 + norm * 0.62;
  if (v < -0.05) return `rgba(132,174,153,${alpha.toFixed(3)})`;
  if (v > 0.05)  return `rgba(193,98,63,${alpha.toFixed(3)})`;
  return 'rgba(43,43,43,0.025)';
}

function fmtVal(v) {
  if (!Number.isFinite(v)) return '—';
  const sign = v > 0 ? '+' : '';
  return `${sign}${v.toFixed(2)}%`;
}

function valColor(v) {
  if (!Number.isFinite(v)) return '#555555';
  if (v < -0.05) return '#3a7a60';
  if (v > 0.05)  return '#8a3e25';
  return '#555555';
}

// Absolute scores (ours / openLCA) in the worst list: 4 significant digits.
function fmtNum(v) {
  if (v == null || !Number.isFinite(v)) return '—';
  return Number(v).toPrecision(4).replace(/\.?0+(e|$)/, '$1');
}

function fmtInt(n) {
  return n == null ? '—' : n.toLocaleString();
}

const DOT_POS = 'rgba(193,98,63,0.6)';   // ours > openLCA
const DOT_NEG = 'rgba(132,174,153,0.6)'; // ours < openLCA

// "<openLCA product name> [<unit>]" for a vs_bafu row; '' when unmatched.
function refLabel(product) {
  if (!product.name_ref) return '';
  return product.mapped_to_ref ? `${product.name_ref} [${product.mapped_to_ref}]` : product.name_ref;
}

// Symmetric log ("symlog") y axis: linear near zero, log10 decades beyond ±10 %.
// compare() folds |Δ| at 1000 %, so ±FOLD_CAP is the full range.
const FOLD_CAP = 1000;
function symlog(v) { return Math.sign(v) * Math.log10(1 + Math.abs(v) / 10); }
const Y_TICKS = [-1000, -100, -10, -1, 0, 1, 10, 100, 1000];
// ±1 % sits 2 % of the half-range from zero: gridline only, no label.
const Y_UNLABELLED = new Set([-1, 1]);
const SYM_MAX = symlog(FOLD_CAP);

// Box-plot geometry (viewBox units).
const BX = { W: 1200, H: 440, padTop: 26, padBottom: 150, padLeft: 58, padRight: 12, boxW: 22 };

function sectorLabel(sector) {
  return sector === 'all' ? 'all sectors' : sector;
}

// Deterministic horizontal jitter so stacked outlier dots do not collapse into
// one line: spreads index i over 13 positions inside the box width.
function jitter(i, halfSpan) {
  return (((i * 7919) % 13) - 6) / 6 * halfSpan;
}

function BoxPlotView({ boxes, sector, reasons, popover, picked, onInfo, onPick, onHover }) {
  const { W, H, padTop, padBottom, padLeft, padRight, boxW } = BX;
  const innerW = W - padLeft - padRight;
  const innerH = H - padTop - padBottom;
  const slotW = innerW / CATS.length;
  const yOf = (v) => {
    const s = Math.max(-SYM_MAX, Math.min(SYM_MAX, symlog(v)));
    return padTop + ((SYM_MAX - s) / (2 * SYM_MAX)) * innerH;
  };
  const yBottom = padTop + innerH;
  const yLabel = yBottom + 12;
  const perSector = (boxes && boxes.boxes[sector]) || (boxes && boxes.boxes.all) || {};

  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="box-svg" role="img" aria-label="Δ% box plots per impact category">
      {/* Y axis: symlog gridlines and tick labels. */}
      {Y_TICKS.map(t => {
        const y = yOf(t);
        const zero = t === 0;
        return (
          <g key={t}>
            <line x1={padLeft} y1={y} x2={W - padRight} y2={y}
                  stroke={zero ? 'rgba(43,43,43,0.55)' : 'rgba(43,43,43,0.07)'}
                  strokeDasharray={zero ? '3 3' : undefined} vectorEffect="non-scaling-stroke" />
            {!Y_UNLABELLED.has(t) && (
              <text x={padLeft - 6} y={y + 3} textAnchor="end" className={'axis' + (zero ? ' axis-zero' : '')}>
                {t > 0 ? '+' : ''}{t}%
              </text>
            )}
          </g>
        );
      })}
      <line x1={padLeft} y1={padTop} x2={padLeft} y2={yBottom} stroke="rgba(43,43,43,0.25)" vectorEffect="non-scaling-stroke" />

      {CATS.map(([id, label], ci) => {
        const b = perSector[id];
        const cx = padLeft + slotW * (ci + 0.5);
        const reason = reasons[id];
        const hasNote = reason && (reason.count > 0 || reason.impact_level);
        const isPicked = picked === id;
        const n = b ? b.n : 0;
        const hover = (e) => onHover({ kind: 'box', id, label, box: b, x: e.clientX, y: e.clientY });
        return (
          <g key={id}>
            {/* Hit area for hover / click over the whole slot column. */}
            <rect className={'hit' + (isPicked ? ' picked' : '')}
                  x={cx - slotW / 2} y={padTop} width={slotW} height={innerH}
                  onMouseEnter={hover} onMouseMove={hover} onMouseLeave={() => onHover(null)}
                  onClick={() => onPick(id)} />
            {b && n > 0 && (
              <g pointerEvents="none">
                {/* Whiskers: the emitter guarantees lo <= q1 <= q3 <= hi, so no clamping here. */}
                <line x1={cx} y1={yOf(b.lo)} x2={cx} y2={yOf(b.hi)} stroke="var(--dim)" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                <line x1={cx - 3} y1={yOf(b.lo)} x2={cx + 3} y2={yOf(b.lo)} stroke="var(--dim)" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                <line x1={cx - 3} y1={yOf(b.hi)} x2={cx + 3} y2={yOf(b.hi)} stroke="var(--dim)" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                <rect x={cx - boxW / 2} y={yOf(b.q3)} width={boxW} height={Math.max(1, yOf(b.q1) - yOf(b.q3))}
                      fill="var(--surf2)" stroke="var(--txt)" strokeWidth="0.75" vectorEffect="non-scaling-stroke" />
                <line x1={cx - boxW / 2} y1={yOf(b.median)} x2={cx + boxW / 2} y2={yOf(b.median)} stroke="var(--accent)" strokeWidth="2" vectorEffect="non-scaling-stroke" />
              </g>
            )}
            {b && b.outliers.map(([code, pct], i) => (
              <circle key={code} cx={cx + jitter(i, boxW / 2 - 3)} cy={yOf(pct)} r="2.5"
                      fill={pct > 0 ? DOT_POS : DOT_NEG} style={{ cursor: 'pointer' }}
                      onMouseEnter={e => onHover({ kind: 'dot', id, label, code, pct, x: e.clientX, y: e.clientY })}
                      onMouseMove={e => onHover({ kind: 'dot', id, label, code, pct, x: e.clientX, y: e.clientY })}
                      onMouseLeave={() => onHover(null)}
                      onClick={() => onPick(id)} />
            ))}
            {hasNote && (
              <g className={'info-icon' + (popover && popover.id === id ? ' active' : '')}
                 onClick={(e) => onInfo(e, id)} style={{ cursor: 'help' }}>
                <title>{`Why ${label} has outliers`}</title>
                <circle cx={cx} cy={padTop - 13} r="6.5" />
                <text x={cx} y={padTop - 10} textAnchor="middle">i</text>
              </g>
            )}
            <text className={'cat-label' + (isPicked ? ' picked' : '')}
                  x={cx} y={yLabel} textAnchor="end" dominantBaseline="middle"
                  transform={`rotate(-90 ${cx} ${yLabel})`} onClick={() => onPick(id)}>{label}</text>
            <text className="cat-n" x={cx} y={H - 4} textAnchor="middle">n={n}</text>
          </g>
        );
      })}
    </svg>
  );
}

const WORST_COLS = [
  ['rank', '#', 'num'],
  ['name', 'process', ''],
  ['location', 'location', ''],
  ['sector', 'sector', ''],
  ['unit', 'unit', ''],
  ['ours', 'ours', 'num'],
  ['ref', BASE_TAG, 'num'],
  ['pct', 'Δ%', 'num'],
];

function WorstList({ short, rows, box, sector, selected, productReasons, onRow, onClose }) {
  const [sortKey, setSortKey] = useState('rank');
  const [sortDir, setSortDir] = useState(1);
  const [filter, setFilter] = useState('');
  const ref = useRef(null);
  const label = (CATS.find(c => c[0] === short) || [short, short])[1];

  useEffect(() => {
    setSortKey('rank'); setSortDir(1); setFilter('');
    if (ref.current) ref.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, [short]);

  const ranked = useMemo(() => Array.isArray(rows) ? rows.map((r, i) => ({ ...r, rank: i + 1 })) : [], [rows]);

  const shown = useMemo(() => {
    const q = filter.trim().toLowerCase();
    const filtered = q
      ? ranked.filter(r => [r.name, r.location, r.sector, r.code].some(v => String(v || '').toLowerCase().includes(q)))
      : ranked;
    const numeric = ['rank', 'ours', 'ref', 'pct'].includes(sortKey);
    return [...filtered].sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (numeric) {
        const af = Number.isFinite(av), bf = Number.isFinite(bv);
        if (af && bf) return sortDir * (av - bv);
        return af ? -1 : bf ? 1 : 0;
      }
      return sortDir * String(av || '').localeCompare(String(bv || ''));
    });
  }, [ranked, filter, sortKey, sortDir]);

  function handleSort(key) {
    if (sortKey === key) setSortDir(d => -d);
    else { setSortKey(key); setSortDir(['ours', 'ref', 'pct'].includes(key) ? -1 : 1); }  // numbers: largest first
  }

  return (
    <div className="worst" ref={ref}>
      <div className="worst-hdr">
        <span className="worst-title">{label} · worst {ranked.length || ''} by |Δ|</span>
        {box && (
          <span className="worst-stats">
            <span>n={fmtInt(box.n)}</span>
            <span>median {fmtVal(box.median)}</span>
            <span>q1 {fmtVal(box.q1)}</span>
            <span>q3 {fmtVal(box.q3)}</span>
            <span>outliers {fmtInt(box.n_outliers)}</span>
          </span>
        )}
        {sector !== 'all' && <span className="worst-note">(worst list is global; sector filter does not apply)</span>}
        <input className="worst-filter" type="search" placeholder="filter name / location / sector"
               value={filter} onChange={e => setFilter(e.target.value)} />
        <button className="detail-close" onClick={onClose}>✕ close</button>
      </div>
      {rows == null && <div className="worst-msg">loading {WORST_DIR}/{short}.json…</div>}
      {rows && rows.error && <div className="worst-msg" style={{ color: '#8a3e25' }}>failed to load {WORST_DIR}/{short}.json: {rows.error}</div>}
      {Array.isArray(rows) && (
        <table>
          <thead>
            <tr>
              {WORST_COLS.map(([key, title, cls]) => (
                <th key={key} className={cls + (sortKey === key ? ' sorted' : '')} onClick={() => handleSort(key)}>
                  {title}{sortKey === key ? (sortDir > 0 ? ' ↑' : ' ↓') : ''}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {shown.map(r => {
              const note = Math.abs(r.pct) > OUTLIER_PCT && productReasons[r.code] ? productReasons[r.code][short] : null;
              return (
                <tr key={r.code} className={selected === r.code ? 'sel' : ''} onClick={() => onRow(r.code)}>
                  <td className="rank">{r.rank}</td>
                  <td className="pname-cell" title={`${r.code}\n${r.name}`}>{r.name}</td>
                  <td>{r.location}</td>
                  <td>{r.sector}</td>
                  <td>{r.unit}</td>
                  <td className="num">{fmtNum(r.ours)}</td>
                  <td className="num">{fmtNum(r.ref)}</td>
                  <td className="pct" style={{ background: cellBg(r.pct) }} title={note || undefined}>
                    {note && <div className="cell-info">i</div>}
                    {fmtVal(r.pct)}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      )}
      {Array.isArray(rows) && shown.length === 0 && <div className="worst-msg">no rows match "{filter}"</div>}
    </div>
  );
}

// Rows of vs_bafu.csv -> product objects for the detail panel.
function toProducts(text) {
  const { rows } = parseCSV(text);
  const ids = CATS.map(c => c[0]);
  return rows.map(r => ({
    code: r.code,
    name: r.name,
    resolution: r.resolution,
    mapped_to: r.mapped_to,
    // BAFU reference row: the matched openLCA product name and the unit its
    // published score refers to.
    name_ref: r.name_ref || '',
    mapped_to_ref: r.mapped_to_ref || '',
    // Blank cells (no/zero reference, >10× gap, method missing) stay NaN;
    // every consumer renders NaN as "—" and skips it in stats.
    vals: ids.map(id => {
      const raw = r[id];
      const n = raw === '' || raw == null ? NaN : parseFloat(raw);
      return Number.isFinite(n) ? n : NaN;
    }),
  }));
}

// Mapped processes in a sector: the largest n + n_blank over its categories.
function mappedCount(perSector) {
  if (!perSector) return 0;
  return Math.max(0, ...Object.values(perSector).map(b => (b.n || 0) + (b.n_blank || 0)));
}

function App() {
  const [boxes, setBoxes] = useState(null);
  const [boxesState, setBoxesState] = useState('loading');  // loading | ok | error
  const [boxesError, setBoxesError] = useState(null);
  const [sector, setSector] = useState('all');
  const [picked, setPicked] = useState(null);  // category short of the open worst list
  const [worstCache, setWorstCache] = useState({});  // short -> rows | { error }
  const inflight = useRef(new Set());
  const [PRODUCTS, setProducts] = useState([]);
  const [productsState, setProductsState] = useState('idle');  // idle | loading | ok | error
  const [productsError, setProductsError] = useState(null);
  const [selected, setSelected] = useState(null);
  const [tooltip, setTooltip] = useState(null);
  const [reasons, setReasons] = useState({});
  const [productReasons, setProductReasons] = useState({});
  const [popover, setPopover] = useState(null);  // { id, x, y }

  useEffect(() => {
    fetch(BOXES_URL)
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(payload => { setBoxes(payload); setBoxesState('ok'); })
      .catch(err => { setBoxesError(err.message || String(err)); setBoxesState('error'); });
  }, []);

  useEffect(() => {
    fetch(REASONS_URL)
      .then(r => r.ok ? r.json() : {})
      .then(setReasons)
      .catch(() => setReasons({}));
  }, []);

  useEffect(() => {
    fetch(PRODUCT_REASONS_URL)
      .then(r => r.ok ? r.json() : {})
      .then(setProductReasons)
      .catch(() => setProductReasons({}));
  }, []);

  // Worst list per category: fetched once on first pick, cached by short.
  useEffect(() => {
    if (!picked || worstCache[picked] || inflight.current.has(picked)) return;
    inflight.current.add(picked);
    fetch(`${WORST_DIR}/${picked}.json`)
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(rows => setWorstCache(c => ({ ...c, [picked]: rows })))
      .catch(err => setWorstCache(c => ({ ...c, [picked]: { error: err.message || String(err) } })))
      .finally(() => inflight.current.delete(picked));
  }, [picked]);

  // vs_bafu.csv is only needed for the per-process bars: one fetch, on the first row click.
  function ensureProducts() {
    if (productsState !== 'idle') return;
    setProductsState('loading');
    fetch(VS_BAFU_URL)
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.text();
      })
      .then(text => { setProducts(toProducts(text)); setProductsState('ok'); })
      .catch(err => { setProductsError(err.message || String(err)); setProductsState('error'); });
  }

  useEffect(() => {
    if (!popover) return;
    const handler = (e) => {
      if (e.target.closest('.method-popover')) return;
      if (e.target.closest('.info-icon')) return;
      setPopover(null);
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [popover]);

  function handleInfoClick(e, id) {
    e.stopPropagation();  // prevent the box pick
    const rect = e.currentTarget.getBoundingClientRect();
    const popWidth = 340;
    const x = Math.min(window.innerWidth - popWidth - 12, Math.max(8, rect.left - popWidth / 2 + rect.width / 2));
    const y = rect.bottom + 8;
    setPopover(p => (p && p.id === id) ? null : { id, x, y });
  }

  function handlePick(id) {
    setPicked(p => (p === id ? null : id));
  }

  function handleRow(code) {
    setSelected(s => (s === code ? null : code));
    ensureProducts();
  }

  const sectors = boxes ? boxes.sectors : ['all'];
  const perSector = boxes ? (boxes.boxes[sector] || boxes.boxes.all) : null;
  const nMapped = mappedCount(perSector);
  const worstRows = picked ? worstCache[picked] : null;

  // Process names known so far (from loaded worst lists) for the dot tooltip.
  const nameByCode = useMemo(() => {
    const out = {};
    for (const rows of Object.values(worstCache)) {
      if (!Array.isArray(rows)) continue;
      for (const r of rows) out[r.code] = r.name;
    }
    return out;
  }, [worstCache]);

  const selectedRow = useMemo(() => {
    if (selected === null) return null;
    for (const rows of Object.values(worstCache)) {
      if (!Array.isArray(rows)) continue;
      const hit = rows.find(r => r.code === selected);
      if (hit) return hit;
    }
    return null;
  }, [worstCache, selected]);

  const detailProduct = selected !== null && productsState === 'ok' ? PRODUCTS.find(p => p.code === selected) : null;

  const detailRows = useMemo(() => {
    if (!detailProduct) return [];
    return CATS.map((cat, i) => ({ label: cat[1], val: detailProduct.vals[i] }))
               .sort((a, b) => {
                 const af = Number.isFinite(a.val), bf = Number.isFinite(b.val);
                 if (af && bf) return Math.abs(b.val) - Math.abs(a.val);
                 if (af) return -1;
                 if (bf) return 1;
                 return 0;
               });
  }, [detailProduct]);

  const detailFinite = detailRows.map(r => r.val).filter(Number.isFinite);
  const detailMax = detailFinite.length ? Math.max(...detailFinite.map(Math.abs)) : 1;

  return (
    <>
      {boxesState !== 'ok' && (
        <div style={{
          padding: '10px 18px',
          background: boxesState === 'error' ? 'rgba(193,98,63,0.12)' : 'rgba(232,230,217,0.5)',
          color: boxesState === 'error' ? '#8a3e25' : '#555555',
          fontFamily: 'JetBrains Mono, monospace', fontSize: 13,
        }}>
          {boxesState === 'loading' && `Loading ${BOXES_URL}…`}
          {boxesState === 'error' && (
            <>
              <div>Failed to load {BOXES_URL}: {boxesError}</div>
              <div style={{ marginTop: 4, opacity: 0.7 }}>
                Serve via HTTP (e.g. <code>cd dashboard &amp;&amp; python -m http.server 8000</code>)
                then open <code>http://localhost:8000/backtest_dashboard.html</code>.
              </div>
            </>
          )}
        </div>
      )}
      <div className="header">
        <img src="dds-logo.svg" alt="Départ de Sentier" style={{ height: 104, width: 'auto', flexShrink: 0 }} />
        <div className="header-text">
          <h1>BAFU-2026 · Δ% vs BAFU EF 3.1 (openLCA)</h1>
          <div className="header-sub">
            {`${fmtInt(nMapped)} processes · ${CATS.length} categories · sector: ${sectorLabel(sector)}`}
          </div>
          <div className="legend" style={{ marginTop: 8 }}>
            <div className="legend-item"><span>box = quartiles q1..q3, line = median</span></div>
            <div className="legend-item"><span>· whiskers = 1.5 IQR</span></div>
            <div className="legend-item"><div className="swatch swatch-orange" /><span>dot: ours &gt; {BASE_TAG}</span></div>
            <div className="legend-item"><div className="swatch swatch-blue" /><span>dot: ours &lt; {BASE_TAG}</span></div>
            <div className="legend-item"><span className="legend-info">i</span><span>documented cause</span></div>
            <div className="legend-item"><span>· click a box: worst 200 · click a row: per-process bars</span></div>
          </div>
          <div className="header-dl">
            downloads: <a href="vs_bafu.csv" download>vs_bafu.csv</a> · <a href="emissions.csv" download>emissions.csv</a> · <a href="run_report.json" download>run_report.json</a>
          </div>
        </div>
        <div className="header-stats">
          <div className="stat-item"><div className="stat-n">{fmtInt(nMapped)}</div><div className="stat-lbl">Processes</div></div>
          <div className="stat-item"><div className="stat-n">{CATS.length}</div><div className="stat-lbl">Categories</div></div>
          <div className="stat-item"><div className="stat-n stat-txt" title={sectorLabel(sector)}>{sectorLabel(sector)}</div><div className="stat-lbl">Sector</div></div>
        </div>
      </div>

      <div className="main">
        <div className="scroll">
          <div className="box-panel">
            <div className="box-bar">
              <label htmlFor="sector-select">sector</label>
              <select id="sector-select" value={sector} onChange={e => { setSector(e.target.value); setTooltip(null); }} disabled={!boxes}>
                {sectors.map(s => <option key={s} value={s}>{sectorLabel(s)}</option>)}
              </select>
              <span>n = mapped processes with a finite Δ · y = symlog(Δ%) · |Δ| folded at {FOLD_CAP}%</span>
            </div>
            {boxes && (
              <BoxPlotView
                boxes={boxes}
                sector={sector}
                reasons={reasons}
                popover={popover}
                picked={picked}
                onInfo={handleInfoClick}
                onPick={handlePick}
                onHover={setTooltip}
              />
            )}
          </div>

          {picked && (
            <WorstList
              short={picked}
              rows={worstRows}
              box={boxes && boxes.boxes.all ? boxes.boxes.all[picked] : null}
              sector={sector}
              selected={selected}
              productReasons={productReasons}
              onRow={handleRow}
              onClose={() => { setPicked(null); setSelected(null); }}
            />
          )}
        </div>

        {selected !== null && (
          <div className="detail">
            <div className="detail-hdr">
              <div>
                <span className="detail-code">{selected}</span>
                <span className="detail-name">{detailProduct ? detailProduct.name : (selectedRow ? selectedRow.name : '')}</span>
              </div>
              <button className="detail-close" onClick={() => setSelected(null)}>✕ close</button>
            </div>
            {productsState === 'loading' && (
              <div className="detail-vers"><div>loading {VS_BAFU_URL} ({VS_BAFU_SIZE})…</div></div>
            )}
            {productsState === 'error' && (
              <div className="detail-vers"><div style={{ color: '#8a3e25' }}>failed to load {VS_BAFU_URL}: {productsError}</div></div>
            )}
            {productsState === 'ok' && !detailProduct && (
              <div className="detail-vers"><div>{selected} is not in {VS_BAFU_URL}</div></div>
            )}
            {detailProduct && (
              <>
                <div className="detail-vers">
                  <div><span className="ver-tag">ours</span>{detailProduct.mapped_to || '—'}</div>
                  <div><span className="ver-tag">{BASE_TAG}</span>{refLabel(detailProduct) || '—'}</div>
                </div>
                <div className="bars">
                  {detailRows.map(({ label, val }) => {
                    const barPct = Number.isFinite(val) ? Math.min(100, Math.sqrt(Math.abs(val)) / Math.sqrt(detailMax) * 100) : 0;
                    return (
                      <div className="bar-row" key={label}>
                        <span className="bar-lbl">{label}</span>
                        <div className="bar-track">
                          <div className="bar-fill" style={{ width: `${barPct}%`, background: cellBg(val) }} />
                        </div>
                        <span className="bar-val" style={{ color: valColor(val) }}>{fmtVal(val)}</span>
                      </div>
                    );
                  })}
                </div>
              </>
            )}
          </div>
        )}
      </div>

      {tooltip && (() => {
        const ttW = 320, ttH = tooltip.kind === 'box' ? 200 : 150;
        const margin = 10;
        let left = tooltip.x + 14;
        if (left + ttW + margin > window.innerWidth) left = Math.max(margin, tooltip.x - ttW - 14);
        let top = tooltip.y - 60;
        if (top < margin) top = tooltip.y + 18;
        if (top + ttH + margin > window.innerHeight) top = Math.max(margin, window.innerHeight - ttH - margin);
        if (tooltip.kind === 'dot') {
          const reason = reasons[tooltip.id];
          const productNote = productReasons[tooltip.code] ? productReasons[tooltip.code][tooltip.id] : null;
          return (
            <div className="tooltip" style={{ left, top }}>
              <div className="tt-cat">{tooltip.label} · outlier</div>
              <div className="tt-val" style={{ color: valColor(tooltip.pct) }}>{fmtVal(tooltip.pct)}</div>
              <div className="tt-prod">{nameByCode[tooltip.code] || tooltip.code}</div>
              {nameByCode[tooltip.code] && <div className="tt-ver" style={{ marginTop: 3 }}>{tooltip.code}</div>}
              {(productNote || (reason && reason.short)) && (
                <div className="tt-reason">
                  {productNote && (
                    <div className="tt-prod-note">
                      <span className="tt-scope">why this product</span>
                      <div className="tt-short">{productNote}</div>
                    </div>
                  )}
                  {reason && reason.short && (
                    <div className={'tt-impact-note' + (productNote ? ' has-prod' : '')}>
                      {reason.tag && <span className="tt-tag">{reason.tag.replace(/_/g, ' ')}</span>}
                      <div className="tt-short">{reason.short}</div>
                    </div>
                  )}
                </div>
              )}
              <div className="tt-hint">click: worst 200 of this category</div>
            </div>
          );
        }
        const b = tooltip.box;
        return (
          <div className="tooltip" style={{ left, top }}>
            <div className="tt-cat">{tooltip.label} · {sectorLabel(sector)}</div>
            {!b || b.n === 0 ? (
              <div className="tt-val" style={{ color: 'var(--dim)' }}>n=0</div>
            ) : (
              <>
                <div className="tt-val" style={{ color: valColor(b.median) }}>median {fmtVal(b.median)}</div>
                <div className="tt-stats">
                  <span>n</span><span>{fmtInt(b.n)}</span>
                  <span>n_blank</span><span>{fmtInt(b.n_blank)}</span>
                  <span>min</span><span>{fmtVal(b.min)}</span>
                  <span>q1</span><span>{fmtVal(b.q1)}</span>
                  <span>median</span><span>{fmtVal(b.median)}</span>
                  <span>q3</span><span>{fmtVal(b.q3)}</span>
                  <span>max</span><span>{fmtVal(b.max)}</span>
                  <span>outliers</span><span>{fmtInt(b.n_outliers)}{b.outliers.length < b.n_outliers ? ` (${b.outliers.length} shown)` : ''}</span>
                </div>
              </>
            )}
            <div className="tt-hint">click: worst 200 of this category</div>
          </div>
        );
      })()}

      {popover && (() => {
        const cat = CATS.find(c => c[0] === popover.id);
        const reason = reasons[popover.id];
        if (!cat || !reason) return null;
        return (
          <div className="method-popover" style={{ left: popover.x, top: popover.y }}>
            <div className="mp-hdr">
              <div className="mp-cat">{cat[1]}</div>
              <button className="mp-close" onClick={() => setPopover(null)}>✕</button>
            </div>
            <div className="mp-meta">
              {reason.count > 0
                ? <span><strong>{reason.count}</strong> outliers</span>
                : <span>library-wide note</span>}
              {reason.direction && <span>{reason.direction}</span>}
              {reason.median_pct != null && <span>median <strong>{reason.median_pct > 0 ? '+' : ''}{reason.median_pct}%</strong></span>}
            </div>
            {reason.tag && <div className="mp-tag">{reason.tag.replace(/_/g, ' ')}</div>}
            <div className="mp-long">{reason.long || reason.short}</div>
            {reason.not_a_bug && <div className="mp-badge">✓ not a calc/mapping defect</div>}
          </div>
        );
      })()}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
