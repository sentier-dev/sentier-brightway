<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAFU-2026 · sentier-brightway vs openLCA (EF 3.1)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      --bg: #F0EEE1;
      --surf: #FFFFFF;
      --surf2: #e8e6d9;
      --bord: #d4d2c5;
      --txt: #2B2B2B;

      --blue: #84AE99;
      --orange: #C1623F;
      --cell-text: rgba(43, 43, 43, 0.82);
      --grid: rgba(43, 43, 43, 0.05);
      --row-sep: rgba(43, 43, 43, 0.04);
      --sel-bg: rgba(60, 83, 67, 0.10);
    }
    html, body { height: 100%; background: var(--bg); color: var(--txt); font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; }
    #root { height: 100%; display: flex; flex-direction: column; }

    .header {
      /* Fixed height so the banner never resizes when the per-view
         title/subtitle/legend content changes (logo 104px + 14/12 padding). */
      height: 130px;
      padding: 14px 22px 12px;
      background: var(--surf);
      border-bottom: 1px solid var(--bord);
      display: flex;
      align-items: center;
      gap: 28px;

    }
    .header-text { flex: 1 1 auto; min-width: 0; max-height: 104px; overflow: hidden; }
    .header h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
    .header-sub { font-size: 10px; color: var(--dim); font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
    .legend { display: flex; gap: 14px; row-gap: 3px; align-items: center; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 9.5px; color: var(--dim); font-family: 'JetBrains Mono', monospace; }
    .swatch { width: 28px; height: 9px; border-radius: 2px; }
    .legend-info { display: inline-flex; align-items: center; justify-content: center; width: 13px; height: 13px; border-radius: 50%; border: 1px solid var(--dim); color: var(--dim); font-size: 9px; font-family: 'JetBrains Mono', monospace; font-weight: 500; line-height: 1; }
    .legend-cellinfo { display: inline-flex; align-items: center; justify-content: center; width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(20,24,40,0.45); color: rgba(20,24,40,0.7); font-size: 7px; font-family: 'JetBrains Mono', monospace; font-weight: 500; line-height: 1; }
    .swatch-blue { background: linear-gradient(to right, rgba(132,174,153,0.15), rgba(132,174,153,0.85)); }
    .swatch-orange { background: linear-gradient(to right, rgba(193,98,63,0.15), rgba(193,98,63,0.85)); }
    .header-stats { margin-left: auto; display: flex; gap: 22px; flex-shrink: 0; }
    .stat-item { text-align: right; }
    .stat-n { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 500; line-height: 1; color: var(--txt); }
    .stat-lbl { font-size: 8.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

    .tabs { display: flex; gap: 4px; margin-left: 24px; flex-shrink: 0; }
    .tab {
      background: transparent; border: 1px solid var(--bord);
      color: var(--dim); cursor: pointer;

      padding: 5px 12px; border-radius: 3px;

    }
    .tab:hover { color: var(--txt); border-color: var(--dim); }

    .main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .table-wrap { flex: 1; overflow: auto; }

    table { border-collapse: separate; border-spacing: 0; width: 100%; }

    thead th {
      position: sticky; top: 0; z-index: 10;

    th.name-col, td.name-col {

    }
    thead th.name-col { z-index: 20; text-align: left; font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; vertical-align: bottom; padding-bottom: 6px; }
    td.name-col { cursor: pointer; }
    .pcode { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--dim); display: block; margin-bottom: 1px; }
    .pname { font-size: 11px; color: var(--txt); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 186px; }

    tbody tr { border-bottom: 1px solid var(--row-sep); cursor: pointer; }
    tbody tr:hover td, tbody tr:hover th { background: var(--surf2) !important; }
    tbody tr.sel td, tbody tr.sel th { background: var(--sel-bg) !important; }

    .detail-code { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--accent); margin-right: 6px; }
    .detail-name { font-size: 12px; font-weight: 600; color: var(--txt); }
    .detail-vers { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; font-size: 10px; color: var(--dim); }
    .detail-close {

      color: var(--dim); cursor: pointer; font-size: 10px;

    .bars { display: flex; flex-direction: column; gap: 3px; max-height: 210px; overflow-y: auto; }

    .bar-track { flex: 1; height: 9px; background: rgba(20,24,40,0.06); border-radius: 2px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 2px; }
    .bar-val { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; width: 72px; flex-shrink: 0; font-weight: 500; }

    .dist-container { flex: 1; overflow-y: auto; padding: 10px 18px 16px; display: flex; flex-direction: column; gap: 10px; }
    .dist-card { background: var(--surf); border: 1px solid var(--bord); border-radius: 4px; padding: 8px 14px 6px; }
    .dist-hdr { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; margin-bottom: 2px; flex-wrap: wrap; }
    .dist-label { font-size: 12px; font-weight: 600; color: var(--txt); }
    .dist-stats { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: var(--dim); display: flex; gap: 12px; flex-wrap: wrap; }
    .dist-stats .below { color: #3a7a60; }
    .dist-stats .above { color: #8a3e25; }
    .dist-chart { position: relative; }
    .dist-svg { width: 100%; height: 180px; display: block; }
    .dist-hit { position: absolute; inset: 0; cursor: crosshair; }
    .dist-marker { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); border: 1.5px solid var(--surf); transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 0 0 1px rgba(60,83,67,0.45); }
    .dist-tip { position: absolute; transform: translate(-50%, calc(-100% - 9px)); pointer-events: none; z-index: 5; background: var(--surf); border: 1px solid var(--bord); border-radius: 4px; padding: 3px 8px; white-space: nowrap; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; box-shadow: 0 2px 10px rgba(60,83,67,0.18); display: flex; gap: 9px; align-items: baseline; }
    .dist-tip-v { font-weight: 600; }
    .dist-tip-c { color: var(--dim); }
    .dist-svg .axis { fill: var(--dim); font-family: 'JetBrains Mono', monospace; font-size: 9px; }
    .dist-svg .axis-zero { fill: var(--txt); }

  </style>

<body>
<div id="root"></div>
<script src="react.min.js"></script>
<script src="react-dom.min.js"></script>
<script src="babel.min.js"></script>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;

// Main-tab data sources, written by `sentier-brightway backtest --out DIR`.
// Both share the column layout code,name,mapped_to,type,resolution,
// [name_ref,mapped_to_ref,] <25 method short IDs matching CATS[][0]>.
//   bafu — vs_bafu.csv   (Δ% of our bw2calc score vs BAFU's openLCA score)
//   abs  — emissions.csv (absolute EF 3.1 scores per reference unit)
const DATA_MODES = {
  bafu: {
    url: 'vs_bafu.csv',
    tab: 'Δ vs BAFU (openLCA)',
    title: 'BAFU-2026 · Δ% vs BAFU\'S PUBLISHED EF 3.1 RESULTS (openLCA)',
    sub: 'same inventory, two toolchains: sentier-brightway (bw2calc, Sentier EF 3.1 methods and BAFU→EF mappings) vs BAFU\'s openLCA run · "—" = no/zero reference value or >10× gap',
    pct: true,
    baseTag: 'openLCA',
  },
  abs: {
    url: 'emissions.csv',
    tab: 'Emissions',
    title: 'BAFU-2026 · EF 3.1 SCORES BY IMPACT CATEGORY',
    sub: 'absolute EF 3.1 scores per reference unit of each process (table unit where a BAFU row exists)',
    pct: false,
    baseTag: '',
  },
};
const REASONS_URL = 'outlier_reasons.json';
// Per-product × outlier-impact notes (authored by dds-build-product-reasons).
// Keyed code → impact short-id → text. Shown above the impact-level note.
const PRODUCT_REASONS_URL = 'product_reasons.json';
// Outlier threshold (percent): a product × impact cell at or above this |%diff|
// surfaces its impact's plain-English explanation (cell ⓘ marker + tooltip reason).
const OUTLIER_PCT = 30;

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return { headers: [], rows: [] };
  const split = (line) => {
    // Minimal CSV split supporting quoted fields with commas.
    const out = []; let cur = ''; let q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { if (q && line[i+1] === '"') { cur += '"'; i++; } else { q = !q; } }
      else if (ch === ',' && !q) { out.push(cur); cur = ''; }
      else { cur += ch; }
    }
    out.push(cur);
    return out;
  };
  const headers = split(lines[0]);
  const rows = lines.slice(1).map(line => {
    const cells = split(line);
    const obj = {};
    headers.forEach((h, i) => obj[h] = cells[i] ?? '');
    return obj;
  });
  return { headers, rows };
}

// CATS-BEGIN
const CATS = [
  ['climate',      'Climate Change'],
  ['cc_bio',       'CC: Biogenic'],
  ['cc_fos',       'CC: Fossil'],
  ['cc_luc',       'CC: LULUC'],
  ['ozone',        'Ozone Depletion'],
  ['radiation',    'Ionising Radiation'],
  ['photo_ox',     'Photochem. Oxidant'],
  ['pm',           'Particulate Matter'],
  ['ht_nc',        'HT: Non-Carcinog.'],
  ['ht_nc_inorg',  'HT: NC Inorg.'],
  ['ht_nc_org',    'HT: NC Org.'],
  ['ht_c',         'HT: Carcinog.'],
  ['ht_c_inorg',   'HT: C Inorg.'],
  ['ht_c_org',     'HT: C Org.'],
  ['acid',         'Acidification'],
  ['e_fw',         'Eutro. Freshwater'],
  ['e_m',          'Eutro. Marine'],
  ['e_t',          'Eutro. Terrestrial'],
  ['ecotox',       'Ecotox. Freshwater'],
  ['ecotox_inorg', 'Ecotox. Inorg.'],
  ['ecotox_org',   'Ecotox. Org.'],
  ['land',         'Land Use'],
  ['water',        'Water Use'],
  ['energy',       'Energy (non-ren.)'],
  ['mater',        'Materials'],
];
// CATS-END


function fmtAbs(v) {
  if (v === '' || v == null || !Number.isFinite(v)) return '—';
  if (Math.abs(v) >= 1000 || (Math.abs(v) > 0 && Math.abs(v) < 0.001)) return v.toExponential(3);
  return v.toFixed(4);
}

// PRODUCTS loaded at runtime from DATA_MODES[dataMode].url. Columns in CSV must match
// CATS[][0] short IDs above, in order.

// SAT_PCT: |%diff| at which background hits max intensity. Larger = outliers
// more visible (typical 10-50% diffs stay faint; 200-500% diffs saturate).
const SAT_PCT = 500;
const DOT_PCT = 300;
function cellBg(v, sat = SAT_PCT) {
  if (!Number.isFinite(v)) return 'rgba(43,43,43,0.025)';
  const abs = Math.abs(v);
  const norm = Math.min(1, Math.sqrt(abs / sat));
  const alpha = 0.10 + norm * 0.62;
  if (v < -0.05) return `rgba(132,174,153,${alpha.toFixed(3)})`;
  if (v > 0.05)  return `rgba(193,98,63,${alpha.toFixed(3)})`;
  return 'rgba(43,43,43,0.025)';
}

function fmtVal(v) {
  if (!Number.isFinite(v)) return '—';
  const sign = v > 0 ? '+' : '';
  return `${sign}${v.toFixed(2)}%`;
}

function valColor(v) {
  if (!Number.isFinite(v)) return '#555555';
  if (v < -0.05) return '#3a7a60';
  if (v > 0.05)  return '#8a3e25';
  return '#555555';
}



function pickYTicks(yMax) {
  const candidates = [10, 25, 50, 100, 200, 500, 1000, 2000, 5000, 10000];
  // Exclude ticks within ~20% of yMax to avoid label collision with the ±yMax edge label.
  const inside = candidates.filter(c => c < yMax * 0.80);
  // Keep last 2 — the coarsest ticks closest to yMax — so the chart never gets crowded.
  // (With 3 ticks at large yMax the lowest tick is too close to the 0 line.)
  return inside.slice(-2);
}

function DistributionCard({ id, label, sorted }) {
  // Index of the histogram bin (frequency-polygon vertex / "dot") under the cursor.
  const [hover, setHover] = useState(null);
  const n = sorted.length;
  const W = 1200, H = 180;
  const padTop = 10, padBottom = 22, padLeft = 60, padRight = 14;
  const innerW = W - padLeft - padRight;
  const innerH = H - padTop - padBottom;

  if (n === 0) {
    return (
      <div className="dist-card">
        <div className="dist-hdr"><span className="dist-label">{label}</span><span className="dist-stats">no data</span></div>
      </div>
    );
  }

  const min = sorted[0];
  const max = sorted[n - 1];
  const median = n % 2 === 1 ? sorted[(n - 1) / 2] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2;
  const below = sorted.filter(v => v < 0).length;
  const above = sorted.filter(v => v > 0).length;
  const xMax = Math.max(Math.abs(min), Math.abs(max), 0.001);

  // Histogram: symmetric value range [-xMax, +xMax] split into NBINS bins.
  // X = bin centre (value, % diff). Y = number of processes in that bin.
  const NBINS = 100;
  const binWidth = (2 * xMax) / NBINS;
  const counts = new Array(NBINS).fill(0);
  for (const v of sorted) {
    let idx = Math.floor((v + xMax) / binWidth);
    if (idx < 0) idx = 0;
    if (idx >= NBINS) idx = NBINS - 1;
    counts[idx]++;
  }
  const maxCount = Math.max(1, ...counts);
  const midX = padLeft + innerW / 2;
  const baseY = padTop + innerH;

  const pts = counts.map((c, i) => {
    const centre = -xMax + (i + 0.5) * binWidth;
    const x = padLeft + ((centre + xMax) / (2 * xMax)) * innerW;
    const y = baseY - (c / maxCount) * innerH;
    return { x, y, centre, count: c };
  });

  // Split bins at zero so negative bins fill blue (under-predict) and
  // positive bins fill orange (over-predict).
  const negPts = pts.filter(p => p.centre < 0);
  const posPts = pts.filter(p => p.centre >= 0);

  const fmtPath = (segments) => {
    if (segments.length === 0) return '';
    const first = segments[0];
    const last = segments[segments.length - 1];
    const inner = segments.map(p => `L${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
    return `M${first.x.toFixed(1)} ${baseY.toFixed(1)} ${inner} L${last.x.toFixed(1)} ${baseY.toFixed(1)} Z`;
  };

  const negPath = fmtPath(negPts);
  const posPath = fmtPath(posPts);
  const linePts = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

  const ticks = pickYTicks(xMax);
  const yTickCount = maxCount > 4 ? (Math.round(maxCount / 2)) : null;

  return (
    <div className="dist-card">
      <div className="dist-hdr">
        <span className="dist-label">{label}</span>
        <span className="dist-stats">
          <span>n={n}</span>
          <span className="below">↓ {below.toLocaleString()} ({(below / n * 100).toFixed(1)}%)</span>
          <span className="above">↑ {above.toLocaleString()} ({(above / n * 100).toFixed(1)}%)</span>
          <span>median {fmtVal(median)}</span>
          <span>min {fmtVal(min)}</span>
          <span>max {fmtVal(max)}</span>
        </span>
      </div>
      <div className="dist-chart">
      <svg viewBox={`0 0 ${W} ${H}`} className="dist-svg" preserveAspectRatio="none">
        {/* Vertical gridlines + x-axis tick labels (value ticks). */}
        {ticks.map(t => {
          const xPos = midX + (t / xMax) * (innerW / 2);
          const xNeg = midX - (t / xMax) * (innerW / 2);
          return (
            <g key={t}>
              <line x1={xPos} y1={padTop} x2={xPos} y2={baseY} stroke="rgba(43,43,43,0.06)" strokeDasharray="2 3" vectorEffect="non-scaling-stroke"/>
              <line x1={xNeg} y1={padTop} x2={xNeg} y2={baseY} stroke="rgba(43,43,43,0.06)" strokeDasharray="2 3" vectorEffect="non-scaling-stroke"/>
              <text x={xPos} y={H - 6} textAnchor="middle" className="axis">+{t}%</text>
              <text x={xNeg} y={H - 6} textAnchor="middle" className="axis">-{t}%</text>
            </g>
          );
        })}
        {/* Edge value labels at the symmetric ±xMax extremes. */}
        <text x={padLeft} y={H - 6} textAnchor="start" className="axis">-{xMax.toFixed(xMax >= 100 ? 0 : xMax >= 10 ? 1 : 2)}%</text>
        <text x={W - padRight} y={H - 6} textAnchor="end" className="axis">+{xMax.toFixed(xMax >= 100 ? 0 : xMax >= 10 ? 1 : 2)}%</text>
        {/* Y-axis count labels: 0 baseline and max bin count. */}
        <text x={padLeft - 6} y={padTop + 8} textAnchor="end" className="axis">{maxCount.toLocaleString()}</text>
        {yTickCount !== null && (
          <g>
            <line x1={padLeft} y1={baseY - innerH / 2} x2={W - padRight} y2={baseY - innerH / 2} stroke="rgba(43,43,43,0.06)" strokeDasharray="2 3" vectorEffect="non-scaling-stroke"/>
            <text x={padLeft - 6} y={baseY - innerH / 2 + 3} textAnchor="end" className="axis">{yTickCount.toLocaleString()}</text>
          </g>
        )}
        <text x={padLeft - 6} y={baseY + 3} textAnchor="end" className="axis axis-zero">0</text>
        {/* Baseline (horizontal) + zero line (vertical). */}
        <line x1={padLeft} y1={baseY} x2={W - padRight} y2={baseY} stroke="rgba(43,43,43,0.45)" vectorEffect="non-scaling-stroke"/>
        <line x1={midX} y1={padTop} x2={midX} y2={baseY} stroke="rgba(43,43,43,0.45)" vectorEffect="non-scaling-stroke"/>
        <text x={midX} y={H - 6} textAnchor="middle" className="axis axis-zero">0</text>
        {/* Filled histogram areas. */}
        <path d={negPath} fill="rgba(132,174,153,0.22)"/>
        <path d={posPath} fill="rgba(193,98,63,0.22)"/>
        {/* Outline (frequency polygon). */}
        <polyline points={linePts} fill="none" stroke="var(--accent)" strokeWidth="1.2" strokeLinejoin="round" vectorEffect="non-scaling-stroke"/>
      </svg>
      {/* Hover layer: maps the cursor to the nearest bin vertex and reads out its
          % diff (x) and product count (y). preserveAspectRatio="none" keeps the
          SVG y-scale 1:1 (height = H), so dots project to left=x/W·100%, top=y px. */}
      <div
        className="dist-hit"
        onMouseMove={e => {
          const rect = e.currentTarget.getBoundingClientRect();
          const xv = ((e.clientX - rect.left) / rect.width) * W;
          let best = 0, bestD = Infinity;
          for (let i = 0; i < pts.length; i++) {
            const d = Math.abs(pts[i].x - xv);
            if (d < bestD) { bestD = d; best = i; }
          }
          setHover(best);
        }}
        onMouseLeave={() => setHover(null)}
      />
      {hover !== null && pts[hover] && (
        <>
          <div className="dist-marker" style={{ left: `${(pts[hover].x / W) * 100}%`, top: `${pts[hover].y}px` }} />
          <div className="dist-tip" style={{ left: `${(pts[hover].x / W) * 100}%`, top: `${Math.max(pts[hover].y, 22)}px` }}>
            <span className="dist-tip-v" style={{ color: valColor(pts[hover].centre) }}>{fmtVal(pts[hover].centre)}</span>
            <span className="dist-tip-c">{pts[hover].count.toLocaleString()} {pts[hover].count === 1 ? 'process' : 'processes'}</span>
          </div>
        </>
      )}
      </div>
    </div>
  );
}

function DistributionsView({ products, loadState, loadError, url }) {
  const charts = useMemo(() => {
    if (products.length === 0) return [];
    return CATS.map(([id, label], ci) => {
      const values = [];
      for (const p of products) {
        const v = p.vals[ci];
        if (Number.isFinite(v)) values.push(v);
      }
      values.sort((a, b) => a - b);
      return { id, label, sorted: values };
    });
  }, [products]);

  if (loadState === 'loading') {
    return <div style={{ padding: '14px 22px', color: 'var(--dim)', fontFamily: 'Nunito, system-ui, sans-serif', fontSize: 12 }}>Loading {url}…</div>;
  }
  if (loadState === 'error') {
    return (
      <div style={{ padding: '14px 22px', color: '#8a3e25', fontFamily: 'Nunito, system-ui, sans-serif', fontSize: 12 }}>
        Failed to load {url}: {loadError}
      </div>
    );
  }

  return (
    <div className="dist-container">
      {charts.map(c => <DistributionCard key={c.id} {...c} />)}
    </div>
  );
}

// "<openLCA product name> [<unit>]" for a vs_bafu row; '' when unmatched.
function refLabel(product) {
  if (!product.name_ref) return '';
  return product.mapped_to_ref ? `${product.name_ref} [${product.mapped_to_ref}]` : product.name_ref;
}

function App() {
  const [PRODUCTS, setProducts] = useState([]);
  const [loadState, setLoadState] = useState('loading');  // loading | ok | error
  const [loadError, setLoadError] = useState(null);
  const [csvCats, setCsvCats] = useState(0);  // CATS columns present in the loaded CSV
  const [selected, setSelected] = useState(null);
  const [tooltip, setTooltip] = useState(null);
  const [sortCol, setSortCol] = useState(null);
  const [sortDir, setSortDir] = useState(1);
  const [reasons, setReasons] = useState({});
  const [productReasons, setProductReasons] = useState({});
  const [popover, setPopover] = useState(null);  // { id, x, y }
  const [activeTab, setActiveTab] = useState('backtest');
  const [dataMode, setDataMode] = useState('bafu');  // bafu | abs
  const MODE = DATA_MODES[dataMode];

  useEffect(() => {
    setLoadState('loading');
    fetch(DATA_MODES[dataMode].url)
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.text();
      })
      .then(text => {
        const { headers, rows } = parseCSV(text);
        const ids = CATS.map(c => c[0]);
        const products = rows.map(r => ({
          code: r.code,
          name: r.name,
          resolution: r.resolution,
          mapped_to: r.mapped_to,
          // BAFU reference row (vs_bafu.csv only): the matched openLCA
          // product name and the unit its published score refers to.
          name_ref: r.name_ref || '',
          mapped_to_ref: r.mapped_to_ref || '',
          // Blank cells (no/zero reference, >10× gap, method missing) stay
          // NaN; every consumer renders NaN as "—" and skips it in stats.
          vals: ids.map(id => {
            const raw = r[id];
            const n = raw === '' || raw == null ? NaN : parseFloat(raw);
            return Number.isFinite(n) ? n : NaN;
          }),
        }));
        setProducts(products);
        setCsvCats(ids.filter(id => headers.includes(id)).length);
        setSelected(null);
        setSortCol(null);
        setLoadState('ok');
      })
      .catch(err => {
        setLoadError(err.message || String(err));
        setLoadState('error');
      });
  }, [dataMode]);

  useEffect(() => {
    fetch(REASONS_URL)
      .then(r => r.ok ? r.json() : {})
      .then(setReasons)
      .catch(() => setReasons({}));
  }, []);

  useEffect(() => {
    fetch(PRODUCT_REASONS_URL)
      .then(r => r.ok ? r.json() : {})
      .then(setProductReasons)
      .catch(() => setProductReasons({}));
  }, []);

  useEffect(() => {
    if (!popover) return;
    const handler = (e) => {
      if (e.target.closest('.method-popover')) return;
      if (e.target.closest('.info-icon')) return;
      setPopover(null);
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [popover]);

  function handleInfoClick(e, id) {
    e.stopPropagation();  // prevent column sort
    const rect = e.currentTarget.getBoundingClientRect();
    const popWidth = 340;
    const x = Math.min(window.innerWidth - popWidth - 12, Math.max(8, rect.left - popWidth / 2 + rect.width / 2));
    const y = rect.bottom + 8;
    setPopover(p => (p && p.id === id) ? null : { id, x, y });
  }

  const colMeans = useMemo(() =>
    CATS.map((_, ci) => {
      const vals = PRODUCTS.map(p => p.vals[ci]).filter(Number.isFinite).map(Math.abs);
      if (vals.length === 0) return '—';
      return (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1);
    }), [PRODUCTS]);

  const rows = useMemo(() => {
    if (sortCol === null) return PRODUCTS;
    const ci = CATS.findIndex(c => c[0] === sortCol);
    return [...PRODUCTS].sort((a, b) => {
      const av = a.vals[ci], bv = b.vals[ci];
      const af = Number.isFinite(av), bf = Number.isFinite(bv);
      if (af && bf) return sortDir * (av - bv);
      if (af) return -1;
      if (bf) return 1;
      return 0;
    });
  }, [PRODUCTS, sortCol, sortDir]);

  function handleColClick(id) {
    if (sortCol === id) setSortDir(d => -d);
    else { setSortCol(id); setSortDir(1); }
  }

  const detailProduct = selected !== null ? PRODUCTS.find(p => p.code === selected) : null;

  const detailRows = useMemo(() => {
    if (!detailProduct) return [];
    return CATS.map((cat, i) => ({ label: cat[1], val: detailProduct.vals[i] }))
               .sort((a, b) => {
                 const af = Number.isFinite(a.val), bf = Number.isFinite(b.val);
                 if (af && bf) return Math.abs(b.val) - Math.abs(a.val);
                 if (af) return -1;
                 if (bf) return 1;
                 return 0;
               });
  }, [detailProduct]);

  const detailFinite = detailRows.map(r => r.val).filter(Number.isFinite);
  const detailMax = detailFinite.length ? Math.max(...detailFinite.map(Math.abs)) : 1;

  return (
    <>
      {loadState !== 'ok' && (
        <div style={{
          padding: '10px 18px',
          background: loadState === 'error' ? 'rgba(193,98,63,0.12)' : 'rgba(232,230,217,0.5)',
          color: loadState === 'error' ? '#8a3e25' : '#555555',
          fontFamily: 'JetBrains Mono, monospace', fontSize: 13,
        }}>
          {loadState === 'loading' && `Loading ${DATA_MODES[dataMode].url}…`}
          {loadState === 'error' && (
            <>
              <div>Failed to load {DATA_MODES[dataMode].url}: {loadError}</div>
              <div style={{ marginTop: 4, opacity: 0.7 }}>
                Serve via HTTP (e.g. <code>cd dashboard &amp;&amp; python -m http.server 8000</code>)
                then open <code>http://localhost:8000/backtest_dashboard.html</code>.
              </div>
            </>
          )}
        </div>
      )}
      <div className="header">
        <img src="dds-logo.svg" alt="Départ de Sentier" style={{ height: 104, width: 'auto', flexShrink: 0 }} />
        <div className="header-text">
          <h1>{
            activeTab === 'backtest' ? MODE.title
            : 'BAFU-2026 · DISTRIBUTIONS PER IMPACT CATEGORY'
          }</h1>
          <div className="header-sub">
            {activeTab === 'backtest' && `${MODE.sub} · ${PRODUCTS.length} processes · ${csvCats} categories`}
            {activeTab === 'distributions' && `Sorted % diffs per impact · ${PRODUCTS.length} processes · ${csvCats} charts`}
          </div>
          {activeTab === 'backtest' && MODE.pct && (
            <div className="legend" style={{ marginTop: 8 }}>
              <div className="legend-item"><div className="swatch swatch-orange" /><span>sentier-brightway &gt; openLCA (higher)</span></div>
              <div className="legend-item"><div className="swatch swatch-blue" /><span>sentier-brightway &lt; openLCA (lower)</span></div>
              <div className="legend-item"><span>· dot = |Δ| &gt; {DOT_PCT}%</span></div>
              <div className="legend-item"><span>· hover a cell / click a row for the matched BAFU row and its unit (join = name + location)</span></div>
              <div className="legend-item"><span className="legend-info">i</span><span>impact-level note — click the column header (whole category)</span></div>
              <div className="legend-item"><span className="legend-cellinfo">i</span><span>per-product note — hover the cell (|Δ| ≥ {OUTLIER_PCT}%)</span></div>
            </div>
          )}
          {activeTab === 'backtest' && !MODE.pct && (
            <div className="legend" style={{ marginTop: 8 }}>
              <div className="legend-item"><span>· absolute EF 3.1 scores per reference unit · click a row for the per-category breakdown</span></div>
            </div>
          )}
          {activeTab === 'distributions' && (
            <div className="legend" style={{ marginTop: 8 }}>
              <div className="legend-item"><div className="swatch swatch-orange" /><span>↑ over (model &gt; ref)</span></div>
              <div className="legend-item"><div className="swatch swatch-blue" /><span>↓ under (model &lt; ref)</span></div>
              <div className="legend-item"><span>· x = % diff (100 bins, symmetric ±max) · y = process count per bin</span></div>
              <div className="legend-item"><span>· hover a curve to read the bin's % diff and process count</span></div>
            </div>
          )}
        </div>
        <div className="tabs">
          {Object.entries(DATA_MODES).map(([key, m]) => (
            <button
              key={key}
              className={'tab' + (activeTab === 'backtest' && dataMode === key ? ' active' : '')}
              onClick={() => { setActiveTab('backtest'); setDataMode(key); }}
            >{m.tab}</button>
          ))}
          <button className={'tab' + (activeTab === 'distributions' ? ' active' : '')} onClick={() => setActiveTab('distributions')}>Distributions</button>
        </div>
        {activeTab === 'backtest' && (
          <div className="header-stats">
            <div className="stat-item"><div className="stat-n">{PRODUCTS.length}</div><div className="stat-lbl">Processes</div></div>
            <div className="stat-item"><div className="stat-n">{csvCats}</div><div className="stat-lbl">Categories</div></div>
          </div>
        )}
        {activeTab === 'distributions' && (
          <div className="header-stats">
            <div className="stat-item"><div className="stat-n">{PRODUCTS.length}</div><div className="stat-lbl">Processes</div></div>
            <div className="stat-item"><div className="stat-n">{csvCats}</div><div className="stat-lbl">Charts</div></div>
          </div>
        )}
      </div>

      <div className="main">
        {activeTab === 'backtest' && (
          <>
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th className="name-col">Process</th>
                    {CATS.map(([id, label], ci) => {
                      const reason = reasons[id];
                      // Show the header ⓘ when an impact carries outliers, or when it
                      // carries a library-wide impact-level note even with zero SKUs
                      // above the threshold (e.g. HT: Carcinog., Ecotox. Freshwater).
                      const hasOutliers = reason && (reason.count > 0 || reason.impact_level);
                      return (
                        <th key={id} className={sortCol === id ? 'sorted' : ''} onClick={() => handleColClick(id)}>
                          <div className="th-wrap">
                            <span className="th-info-slot">
                              {hasOutliers && (
                                <span
                                  className={`info-icon ${popover && popover.id === id ? 'active' : ''}`}
                                  onClick={(e) => handleInfoClick(e, id)}
                                  title={`Why ${label} has outliers`}
                                >i</span>
                              )}
                            </span>
                            <span className="th-text">{label}</span>
                            <span className="th-mean">μ={colMeans[ci]}</span>
                            {sortCol === id && <span>{sortDir > 0 ? '↑' : '↓'}</span>}
                          </div>
                        </th>
                      );
                    })}
                  </tr>
                </thead>
                <tbody>
                  {rows.map(product => (
                    <tr
                      key={product.code}
                      className={selected === product.code ? 'sel' : ''}
                      onClick={() => setSelected(s => (s === product.code ? null : product.code))}
                    >
                      <td className="name-col">
                        <span className="pcode">{product.code}</span>
                        <span className="pname" title={MODE.pct && product.name_ref
                          ? `${product.name}\nours · ${product.mapped_to}\n${MODE.baseTag} · ${product.name_ref} [${product.mapped_to_ref}]`
                          : (product.mapped_to ? `${product.name}\n${product.mapped_to}` : product.name)
                        }>{product.name}</span>
                      </td>
                      {product.vals.map((v, ci) => {
                        const isOutlier = MODE.pct && Math.abs(v) > OUTLIER_PCT;
                        const catId = CATS[ci][0];
                        const hasReason = isOutlier && reasons[catId] && reasons[catId].short;
                        return (
                          <td
                            key={ci}
                            className="data-cell"
                            style={{ background: MODE.pct ? cellBg(v) : 'rgba(43,43,43,0.03)' }}
                            onMouseEnter={e => setTooltip({ x: e.clientX, y: e.clientY, v, ci, pname: product.name, code: product.code, mOurs: product.mapped_to, mRef: refLabel(product) })}
                            onMouseLeave={() => setTooltip(null)}
                            onMouseMove={e => setTooltip(t => t ? { ...t, x: e.clientX, y: e.clientY } : null)}
                          >
                            {hasReason && <div className="cell-info">i</div>}
                            {MODE.pct && Math.abs(v) > DOT_PCT && <div className="xdot" />}
                            {MODE.pct ? fmtVal(v) : fmtAbs(v)}
                          </td>
                        );
                      })}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {detailProduct && (
              <div className="detail">
                <div className="detail-hdr">
                  <div>
                    <span className="detail-code">{detailProduct.code}</span>
                    <span className="detail-name">{detailProduct.name}</span>
                  </div>
                  <button className="detail-close" onClick={() => setSelected(null)}>✕ close</button>
                </div>
                <div className="detail-vers">
                  <div><span className="ver-tag">ours</span>{detailProduct.mapped_to || '—'}</div>
                  {MODE.pct && <div><span className="ver-tag">{MODE.baseTag}</span>{refLabel(detailProduct) || '—'}</div>}
                </div>
                <div className="bars">
                  {detailRows.map(({ label, val }) => {
                    const barPct = Number.isFinite(val) ? Math.min(100, Math.sqrt(Math.abs(val)) / Math.sqrt(detailMax) * 100) : 0;
                    return (
                      <div className="bar-row" key={label}>
                        <span className="bar-lbl">{label}</span>
                        <div className="bar-track">
                          <div className="bar-fill" style={{ width: `${barPct}%`, background: MODE.pct ? cellBg(val) : 'rgba(60,83,67,0.35)' }} />
                        </div>
                        <span className="bar-val" style={{ color: MODE.pct ? valColor(val) : 'inherit' }}>{MODE.pct ? fmtVal(val) : fmtAbs(val)}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </>
        )}
        {activeTab === 'distributions' && (
          <DistributionsView
            products={PRODUCTS}
            loadState={loadState}
            loadError={loadError}
            url={MODE.url}
          />
        )}
      </div>

      {activeTab === 'backtest' && tooltip && (() => {
        const catId = CATS[tooltip.ci][0];
        const reason = reasons[catId];
        const isOutlier = MODE.pct && Math.abs(tooltip.v) > OUTLIER_PCT;
        const productNote = isOutlier && productReasons[tooltip.code]
          ? productReasons[tooltip.code][catId]
          : null;
        const showReason = isOutlier && ((reason && reason.short) || productNote);
        const showVersions = MODE.pct && (tooltip.mOurs || tooltip.mRef);
        const ttW = 320, ttH = (showReason ? (productNote ? 260 : 180) : 90) + (showVersions ? 70 : 0);
        const margin = 10;
        let left = tooltip.x + 14;
        if (left + ttW + margin > window.innerWidth) left = Math.max(margin, tooltip.x - ttW - 14);
        let top = tooltip.y - 60;
        if (top < margin) top = tooltip.y + 18;
        if (top + ttH + margin > window.innerHeight) top = Math.max(margin, window.innerHeight - ttH - margin);
        return (
          <div className="tooltip" style={{ left, top }}>
            <div className="tt-cat">{CATS[tooltip.ci][1]}</div>
            <div className="tt-val" style={{ color: MODE.pct ? valColor(tooltip.v) : 'inherit' }}>{MODE.pct ? fmtVal(tooltip.v) : fmtAbs(tooltip.v)}</div>
            <div className="tt-prod">{tooltip.pname}</div>
            {showVersions && (
              <div className="tt-vers">
                <div className="tt-ver"><span className="ver-tag">ours</span>{tooltip.mOurs || '—'}</div>
                <div className="tt-ver"><span className="ver-tag">{MODE.baseTag}</span>{tooltip.mRef || '—'}</div>
              </div>
            )}
            {showReason && (
              <div className="tt-reason">
                {productNote && (
                  <div className="tt-prod-note">
                    <span className="tt-scope">why this product</span>
                    <div className="tt-short">{productNote}</div>
                  </div>
                )}
                {reason && reason.short && (
                  <div className={'tt-impact-note' + (productNote ? ' has-prod' : '')}>
                    {productNote && <span className="tt-scope">this impact, library-wide</span>}
                    {reason.tag && <span className="tt-tag">{reason.tag.replace(/_/g, ' ')}</span>}
                    <div className="tt-short">{reason.short}</div>
                  </div>
                )}
                <div className="tt-hint">click ⓘ in column header for full detail</div>
              </div>
            )}
          </div>
        );
      })()}

      {activeTab === 'backtest' && popover && (() => {
        const cat = CATS.find(c => c[0] === popover.id);
        const reason = reasons[popover.id];
        if (!cat || !reason) return null;
        return (
          <div className="method-popover" style={{ left: popover.x, top: popover.y }}>
            <div className="mp-hdr">
              <div className="mp-cat">{cat[1]}</div>
              <button className="mp-close" onClick={() => setPopover(null)}>✕</button>
            </div>
            <div className="mp-meta">
              {reason.count > 0
                ? <span><strong>{reason.count}</strong> outliers</span>
                : <span>library-wide note</span>}
              {reason.direction && <span>{reason.direction}</span>}
              {reason.median_pct != null && <span>median <strong>{reason.median_pct > 0 ? '+' : ''}{reason.median_pct}%</strong></span>}
            </div>
            {reason.tag && <div className="mp-tag">{reason.tag.replace(/_/g, ' ')}</div>}
            <div className="mp-long">{reason.long || reason.short}</div>
            {reason.not_a_bug && <div className="mp-badge">✓ not a calc/mapping defect</div>}
          </div>
        );
      })()}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
